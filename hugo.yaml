baseURL: https://rcc-cubac.github.io/workspace/
title: 笔记
theme: PaperMod

locale: zh-cn
defaultContentLanguage: zh-cn
hasCJKLanguage: true

# 不生成 RSS 与 sitemap，降低被发现的概率
disableKinds:
  - rss
  - sitemap
enableRobotsTXT: false

# 给所有页面下发 robotsNoIndex，PaperMod 会据此输出 noindex 标记，阻止搜索引擎收录
cascade:
  - params:
      robotsNoIndex: true

pagination:
  pagerSize: 20

# PaperMod 搜索功能需要首页额外输出 JSON 索引
outputs:
  home:
    - HTML
    - JSON

params:
  env: production
  defaultTheme: auto
  math: true

  # 主题默认的 :date_long 在本站的语言设置下会落回英文，这里显式指定中文格式
  DateFormat: "2006年1月2日"

  ShowReadingTime: true
  ShowToc: true
  TocOpen: false
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true

  homeInfoParams:
    Title: 笔记
    Content: 日常笔记与论文阅读记录．

menu:
  main:
    - name: 笔记
      url: notes/
      weight: 10
    - name: 论文阅读
      url: papers/
      weight: 20
    - name: 会议日历
      url: timeline/
      weight: 25
    - name: 标签
      url: tags/
      weight: 30
    - name: 归档
      url: archives/
      weight: 40
    - name: 搜索
      url: search/
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true
    # 把数学公式原样交给 KaTeX 处理，否则 Markdown 解析器会吞掉 \! 与成对下划线，公式渲染出错
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\[', '\]']
          inline:
            - ['$', '$']
            - ['\(', '\)']
  highlight:
    noClasses: false
